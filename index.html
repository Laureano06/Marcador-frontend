<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1a2d" />
    <!-- Meta tags "apple-*": Safari en iOS no lee bien el manifest.webmanifest
         (soporte parcial/tardío), así que esto es lo que de verdad hace que
         "Agregar a inicio" en iPhone abra en pantalla completa sin barra de
         Safari y con el ícono correcto. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PARTIDOS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Resultados de fútbol en vivo de todas las ligas del mundo, minuto a minuto."
    />
    <title>PARTIDOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
